
{% load static %}
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Astra Tech{% endblock %}</title>

    <!-- =====================================================
         BOOTSTRAP
    ====================================================== -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    >

    <!-- =====================================================
         CSS ASTRA TECH
    ====================================================== -->
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/header.css' %}">
    <link rel="stylesheet" href="{% static 'css/footer.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    {% block css %}
    {% endblock %}

    <link rel="stylesheet" href="{% static 'css/responsive.css' %}">

    <!-- =====================================================
         STYLE GLOBAL
    ====================================================== -->
    <style>

        /* =====================================================
           RESET GLOBAL
        ====================================================== */

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            overflow-x: hidden;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        img {
            max-width: 100%;
            height: auto;
        }

        /* =====================================================
           STRUCTURE PRINCIPALE
        ====================================================== */

        .app-layout {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .app-main {
            flex: 1;
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
        }

        .app-footer {
            width: 100%;
            margin-top: auto;
        }

        /* =====================================================
           RESPONSIVE MOBILE
        ====================================================== */

        @media (max-width: 991.98px) {

            html,
            body {
                width: 100%;
                max-width: 100%;
                overflow-x: hidden;
            }

            .app-main {
                width: 100%;
                max-width: 100%;
                padding-left: 0;
                padding-right: 0;
            }

            .container,
            .container-fluid {
                max-width: 100%;
            }

            .table-responsive {
                width: 100%;
                max-width: 100%;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }
        }

        /* =====================================================
           TRÈS PETITS ÉCRANS
        ====================================================== */

        @media (max-width: 575.98px) {

            .app-main {
                padding-left: 0;
                padding-right: 0;
            }

            h1 {
                font-size: 1.7rem;
            }

            h2 {
                font-size: 1.45rem;
            }

            h3 {
                font-size: 1.25rem;
            }

            .btn {
                max-width: 100%;
            }
        }

    </style>

</head>

<body class="app-layout">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    {% block header %}
        {% include "astra/header.html" %}
    {% endblock %}


    <!-- =====================================================
         CONTENU PRINCIPAL
    ====================================================== -->

    <main class="app-main">

        {% block content %}
        {% endblock %}

    </main>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="app-footer">

        {% block footer %}
            {% include "astra/footer.html" %}
        {% endblock %}

    </footer>


    <!-- =====================================================
         BOOTSTRAP JS
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- =====================================================
         JAVASCRIPT DES PAGES
    ====================================================== -->

    {% block extra_js %}
    {% endblock %}

</body>

</html>
