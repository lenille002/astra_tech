```html
{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{% static 'css/responsive.css' %}">

    <title>Modifier le mot de passe - Astra Tech</title>

    <style>
        /* =========================================================
           RESET & BASE MOBILE-FIRST
        ========================================================= */
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(
                circle at center,
                #1e293b 0%,
                #0f172a 100%
            );

            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 16px 10px;

            overflow-x: hidden;
        }

        /* =========================================================
           CARTE
        ========================================================= */
        .card {
            background: #ffffff;

            width: 100%;
            max-width: 420px;

            padding: 24px 18px;

            border-radius: 18px;

            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);

            text-align: center;

            margin: 0 auto;

            overflow: hidden;
        }

        /* =========================================================
           TITRE
        ========================================================= */
        h2 {
            color: #1e293b;

            margin: 0 0 10px;

            font-size: 24px;
            line-height: 1.25;

            word-break: break-word;
        }

        /* =========================================================
           DESCRIPTION
        ========================================================= */
        p {
            color: #64748b;

            font-size: 13px;
            line-height: 1.6;

            margin: 0 0 22px;

            overflow-wrap: anywhere;
        }

        p strong {
            color: #1e293b;
        }

        /* =========================================================
           MESSAGES
        ========================================================= */
        .alert-error,
        .alert-success {
            width: 100%;

            padding: 10px 12px;

            border-radius: 8px;

            font-size: 13px;
            line-height: 1.5;

            margin-bottom: 18px;

            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .alert-error {
            background-color: #fee2e2;
            color: #991b1b;
        }

        .alert-success {
            background-color: #dcfce7;
            color: #166534;
        }

        /* =========================================================
           FORMULAIRE
        ========================================================= */
        form {
            width: 100%;
        }

        .form-group {
            width: 100%;

            margin-bottom: 18px;

            text-align: left;
        }

        label {
            display: block;

            font-size: 11px;
            font-weight: bold;

            color: #475569;

            margin-bottom: 7px;

            text-transform: uppercase;

            line-height: 1.4;
        }

        input {
            display: block;

            width: 100%;
            max-width: 100%;

            min-height: 48px;

            padding: 12px 13px;

            border: 1px solid #cbd5e1;
            border-radius: 10px;

            font-family: inherit;
            font-size: 14px;

            color: #1e293b;
            background: #ffffff;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;

            -webkit-appearance: none;
            appearance: none;
        }

        input::placeholder {
            color: #94a3b8;
            opacity: 1;
        }

        input:focus {
            border-color: #f97316;

            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.12);
        }

        /* =========================================================
           BOUTON
        ========================================================= */
        .btn-submit {
            display: block;

            width: 100%;

            min-height: 50px;

            padding: 13px 15px;

            margin-top: 8px;

            background-color: #f97316;
            color: white;

            border: none;
            border-radius: 10px;

            font-family: inherit;
            font-size: 14px;
            font-weight: bold;

            line-height: 1.4;

            cursor: pointer;

            transition:
                background-color 0.2s ease,
                transform 0.15s ease;

            overflow-wrap: anywhere;
        }

        .btn-submit:hover {
            background-color: #ea580c;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .btn-submit:focus-visible {
            outline: 3px solid rgba(249, 115, 22, 0.3);
            outline-offset: 2px;
        }

        /* =========================================================
           LIEN RETOUR
        ========================================================= */
        .back-link {
            display: block;

            width: 100%;

            margin-top: 18px;

            padding: 5px;

            color: #64748b;

            text-decoration: none;

            font-size: 13px;
            line-height: 1.5;

            text-align: center;

            overflow-wrap: anywhere;

            transition:
                color 0.2s ease,
                text-decoration-color 0.2s ease;
        }

        .back-link:hover {
            color: #f97316;
            text-decoration: underline;
        }

        .back-link:focus-visible {
            outline: 2px solid #f97316;
            outline-offset: 3px;
            border-radius: 4px;
        }

        /* =========================================================
           TRÈS PETITS ÉCRANS
        ========================================================= */
        @media (max-width: 359px) {
            body {
                padding: 12px 8px;
            }

            .card {
                padding: 20px 14px;
                border-radius: 16px;
            }

            h2 {
                font-size: 21px;
            }

            p {
                font-size: 12px;
                margin-bottom: 19px;
            }

            .form-group {
                margin-bottom: 15px;
            }

            label {
                font-size: 10px;
            }

            input {
                min-height: 46px;
                padding: 11px 12px;
                font-size: 13px;
            }

            .btn-submit {
                min-height: 48px;
                padding: 12px;
                font-size: 13px;
            }

            .back-link {
                font-size: 12px;
            }
        }

        /* =========================================================
           PETITS SMARTPHONES / GRANDES LARGEURS
        ========================================================= */
        @media (min-width: 360px) {
            .card {
                padding: 26px 20px;
            }

            h2 {
                font-size: 25px;
            }

            p {
                font-size: 13px;
            }
        }

        /* =========================================================
           TABLETTES
        ========================================================= */
        @media (min-width: 576px) {
            body {
                padding: 24px 16px;
            }

            .card {
                max-width: 420px;

                padding: 34px 30px;

                border-radius: 20px;
            }

            h2 {
                font-size: 27px;
            }

            p {
                font-size: 14px;
                margin-bottom: 25px;
            }

            .form-group {
                margin-bottom: 20px;
            }

            label {
                font-size: 12px;
                margin-bottom: 8px;
            }

            input {
                min-height: 48px;
                padding: 12px 15px;
                font-size: 14px;
            }

            .btn-submit {
                min-height: 50px;
                padding: 14px;
                font-size: 15px;
            }

            .back-link {
                margin-top: 20px;
                font-size: 13px;
            }
        }

        /* =========================================================
           DESKTOP
        ========================================================= */
        @media (min-width: 768px) {
            body {
                padding: 30px 20px;
            }

            .card {
                padding: 40px;
            }

            h2 {
                font-size: 27px;
            }
        }

        /* =========================================================
           GRAND ÉCRAN
        ========================================================= */
        @media (min-width: 992px) {
            body {
                padding: 40px 24px;
            }
        }

        /* =========================================================
           RÉDUCTION DES ANIMATIONS
        ========================================================= */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition: none !important;
                animation: none !important;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <h2>Sécurité</h2>

        <p>
            Mettez à jour le mot de passe pour
            <strong style="color: #1e293b;">{{ client.nom }}</strong>.
        </p>

        <!-- Affichage des messages Django -->
        {% if messages %}
            {% for message in messages %}
                <div class="{% if message.tags == 'error' %}alert-error{% else %}alert-success{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <!-- Formulaire sécurisé avec l'ancien mot de passe -->
        <form method="POST" action="{% url 'astra:modifier_mot_de_passe_client' client.id %}">
            {% csrf_token %}

            <div class="form-group">
                <label>Ancien mot de passe</label>

                <input
                    type="password"
                    name="ancien_password"
                    placeholder="Entrez votre mot de passe actuel"
                    autocomplete="current-password"
                    required
                >
            </div>

            <div class="form-group">
                <label>Nouveau mot de passe</label>

                <input
                    type="password"
                    name="nouveau_password"
                    placeholder="Entrez le nouveau mot de passe"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div class="form-group">
                <label>Confirmer le mot de passe</label>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Répétez le nouveau mot de passe"
                    autocomplete="new-password"
                    required
                >
            </div>

            <button type="submit" class="btn-submit">
                Mettre à jour le mot de passe
            </button>
        </form>

        <!-- Lien de retour vers la page de connexion -->
        <a
            href="{% url 'astra:client_login' client.id %}"
            class="back-link"
        >
            ← Retour à la connexion
        </a>

    </div>

</body>
</html>
```
