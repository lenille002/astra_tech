<title>Connexion - ASTRA TECH</title>

<!-- CSS principal -->
<link rel="stylesheet" href="{% static 'css/style.css' %}">

<!-- CSS responsive -->
<link rel="stylesheet" href="{% static 'css/responsive.css' %}">

<!-- Font Awesome -->
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<!-- AOS -->
<link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">

<style>
    /* =========================================================
       MOBILE FIRST — CONNEXION ASTRA TECH
       ========================================================= */

    * {
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        max-width: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
    }

    body.login-body {
        min-height: 100vh;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        position: relative;
    }

    /* ---------------------------------------------------------
       BACKGROUND VANTA
       --------------------------------------------------------- */

    #vanta-canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        overflow: hidden;
    }

    /* ---------------------------------------------------------
       CONTENEUR PRINCIPAL
       --------------------------------------------------------- */

    .login-container {
        position: relative;
        z-index: 2;
        width: 100%;
        max-width: 430px;
        margin: 0 auto;
    }

    /* ---------------------------------------------------------
       HEADER
       --------------------------------------------------------- */

    .login-header {
        width: 100%;
        text-align: center;
        padding: 0 8px 20px;
    }

    .login-header .logo {
        display: block;
        width: 64px;
        height: 64px;
        max-width: 100%;
        object-fit: contain;
        margin: 0 auto 12px;
    }

    .login-header h1 {
        margin: 0;
        font-size: 1.65rem;
        line-height: 1.2;
        word-break: break-word;
    }

    .login-header p {
        margin: 7px 0 0;
        font-size: 0.82rem;
        line-height: 1.4;
    }

    /* ---------------------------------------------------------
       FORMULAIRE
       --------------------------------------------------------- */

    .login-form {
        width: 100%;
    }

    .login-form form {
        width: 100%;
    }

    /* ---------------------------------------------------------
       MESSAGE D'ERREUR
       --------------------------------------------------------- */

    .alert-message {
        width: 100%;
        margin-bottom: 18px !important;
        padding: 11px 12px !important;
        font-size: 13px !important;
        line-height: 1.4;
        overflow-wrap: anywhere;
    }

    /* ---------------------------------------------------------
       GROUPES INPUT
       --------------------------------------------------------- */

    .input-group {
        width: 100%;
        margin-bottom: 17px;
    }

    .input-group label {
        display: block;
        width: 100%;
        margin-bottom: 7px;
        font-size: 13px;
        line-height: 1.4;
        overflow-wrap: anywhere;
    }

    .input-group label i {
        margin-right: 4px;
    }

    .input-group input {
        width: 100%;
        max-width: 100%;
        min-height: 48px;
        padding: 12px 13px;
        font-size: 14px;
        border-radius: 9px;
        outline: none;
    }

    .input-group input::placeholder {
        font-size: 13px;
    }

    /* ---------------------------------------------------------
       CHAMP MOT DE PASSE
       --------------------------------------------------------- */

    .password-box {
        position: relative;
        width: 100%;
    }

    .password-box input {
        width: 100%;
        padding-right: 48px;
    }

    .password-toggle {
        position: absolute;
        top: 50%;
        right: 5px;
        transform: translateY(-50%);
        width: 40px;
        height: 40px;
        min-width: 40px;
        border: 0;
        background: transparent;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        border-radius: 8px;
        z-index: 2;
    }

    .password-toggle i {
        font-size: 14px;
    }

    /* ---------------------------------------------------------
       REMEMBER / MOT DE PASSE OUBLIÉ
       --------------------------------------------------------- */

    .remember-forgot {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
        margin: 3px 0 20px;
    }

    .remember-me {
        display: flex;
        align-items: center;
        gap: 7px;
        width: 100%;
        min-width: 0;
    }

    .remember-me input {
        width: 16px;
        height: 16px;
        min-width: 16px;
        margin: 0;
        cursor: pointer;
    }

    .remember-me label {
        margin: 0;
        font-size: 13px;
        line-height: 1.3;
        cursor: pointer;
        overflow-wrap: anywhere;
    }

    .forgot-link {
        display: block;
        width: 100%;
        font-size: 13px;
        line-height: 1.3;
        text-decoration: none;
        overflow-wrap: anywhere;
    }

    /* ---------------------------------------------------------
       BOUTON CONNEXION
       --------------------------------------------------------- */

    .login-btn {
        width: 100%;
        min-height: 50px;
        padding: 12px 16px;
        border: 0;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        cursor: pointer;
        transition: transform 0.2s ease,
                    box-shadow 0.2s ease,
                    background 0.2s ease;
    }

    .login-btn i {
        font-size: 14px;
    }

    /* ---------------------------------------------------------
       LIEN SÉCURITÉ
       --------------------------------------------------------- */

    .signup-link {
        width: 100%;
        margin-top: 17px;
        text-align: center;
        font-size: 11px;
        line-height: 1.4;
        padding: 0 4px;
        overflow-wrap: anywhere;
    }

    .signup-link i {
        margin-right: 4px;
    }

    /* ---------------------------------------------------------
       PETITS TÉLÉPHONES
       --------------------------------------------------------- */

    @media (max-width: 360px) {

        body.login-body {
            padding: 12px;
        }

        .login-header {
            padding-bottom: 16px;
        }

        .login-header .logo {
            width: 56px;
            height: 56px;
            margin-bottom: 9px;
        }

        .login-header h1 {
            font-size: 1.45rem;
        }

        .login-header p {
            font-size: 0.75rem;
        }

        .input-group {
            margin-bottom: 14px;
        }

        .input-group label {
            font-size: 12px;
        }

        .input-group input {
            min-height: 46px;
            padding: 11px 12px;
            font-size: 13px;
        }

        .remember-forgot {
            gap: 10px;
            margin-bottom: 17px;
        }

        .remember-me label,
        .forgot-link {
            font-size: 12px;
        }

        .login-btn {
            min-height: 48px;
            font-size: 13px;
        }

        .signup-link {
            font-size: 10px;
        }
    }

    /* ---------------------------------------------------------
       SMARTPHONES LARGES / PETITES TABLETTES
       --------------------------------------------------------- */

    @media (min-width: 576px) {

        body.login-body {
            padding: 24px;
        }

        .login-container {
            max-width: 430px;
        }

        .login-header {
            padding-bottom: 24px;
        }

        .login-header .logo {
            width: 70px;
            height: 70px;
        }

        .login-header h1 {
            font-size: 1.8rem;
        }

        .login-header p {
            font-size: 0.85rem;
        }

        .remember-forgot {
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .remember-me {
            width: auto;
        }

        .forgot-link {
            width: auto;
            text-align: right;
        }
    }

    /* ---------------------------------------------------------
       TABLETTES
       --------------------------------------------------------- */

    @media (min-width: 768px) {

        body.login-body {
            padding: 32px;
        }

        .login-container {
            max-width: 440px;
        }

        .login-header .logo {
            width: 74px;
            height: 74px;
        }

        .login-header h1 {
            font-size: 1.9rem;
        }

        .input-group label {
            font-size: 14px;
        }

        .input-group input {
            min-height: 50px;
            font-size: 14px;
        }

        .login-btn {
            min-height: 52px;
            font-size: 15px;
        }
    }

    /* ---------------------------------------------------------
       DESKTOP
       --------------------------------------------------------- */

    @media (min-width: 992px) {

        body.login-body {
            padding: 40px;
        }

        .login-container {
            max-width: 450px;
        }

        .login-header .logo {
            width: 78px;
            height: 78px;
        }

        .login-header h1 {
            font-size: 2rem;
        }

        .login-header p {
            font-size: 0.9rem;
        }
    }

    /* ---------------------------------------------------------
       ACCESSIBILITÉ
       --------------------------------------------------------- */

    .password-toggle:focus-visible,
    .login-btn:focus-visible,
    .forgot-link:focus-visible,
    .remember-me input:focus-visible,
    .input-group input:focus-visible {
        outline: 2px solid #ff7a29;
        outline-offset: 2px;
    }

    /* ---------------------------------------------------------
       RÉDUCTION DES ANIMATIONS
       --------------------------------------------------------- */

    @media (prefers-reduced-motion: reduce) {

        *,
        *::before,
        *::after {
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.01ms !important;
            scroll-behavior: auto !important;
        }
    }
</style>

```
<!-- Arrière-plan animé -->
<div id="vanta-canvas"></div>

<!-- Conteneur connexion -->
<div class="login-container" data-aos="zoom-in">

    <!-- En-tête -->
    <div class="login-header">

        <img
            src="{% static 'image/logoo.png' %}"
            class="logo"
            alt="Logo ASTRA TECH"
        >

        <h1>ASTRA TECH</h1>

        <p>Espace professionnel sécurisé</p>

    </div>

    <!-- Formulaire -->
    <div class="login-form">

        <!-- Message d'erreur -->
        {% if erreur %}
        <div class="alert-message">
            <i class="fas fa-exclamation-circle"></i>
            {{ erreur }}
        </div>
        {% endif %}

        <form method="POST" action="">

            {% csrf_token %}

            {% if next %}
            <input
                type="hidden"
                name="next"
                value="{{ next }}"
            >
            {% endif %}

            <!-- Email / Nom utilisateur -->
            <div class="input-group">

                <label for="email">
                    <i class="fas fa-envelope"></i>
                    Adresse email ou Nom d'utilisateur
                </label>

                <input
                    type="text"
                    id="email"
                    name="email"
                    placeholder="exemple@astratech.com"
                    autocomplete="username"
                    required
                >

            </div>

            <!-- Mot de passe -->
            <div class="input-group">

                <label for="password">
                    <i class="fas fa-lock"></i>
                    Mot de passe
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Votre mot de passe"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="togglePassword"
                        aria-label="Afficher ou masquer le mot de passe"
                    >
                        <i class="fas fa-eye"></i>
                    </button>

                </div>

            </div>

            <!-- Se souvenir / Mot de passe oublié -->
            <div class="remember-forgot">

                <div class="remember-me">

                    <input
                        type="checkbox"
                        id="remember"
                        name="remember"
                    >

                    <label for="remember">
                        Rester connecté
                    </label>

                </div>

                <a href="#" class="forgot-link">
                    Mot de passe oublié ?
                </a>

            </div>

            <!-- Connexion -->
            <button type="submit" class="login-btn">

                <i class="fas fa-arrow-right-to-bracket"></i>

                <span>Se connecter</span>

            </button>

            <!-- Sécurité -->
            <div class="signup-link">

                <i class="fas fa-shield-alt"></i>

                Espace sécurisé (Accès administrateur)

            </div>

        </form>

    </div>

</div>

<!-- Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>

<!-- Vanta.js -->
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>

<!-- AOS -->
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

<script>

    /* =========================================================
       AOS
       ========================================================= */

    AOS.init({
        once: true,
        duration: 700
    });


    /* =========================================================
       VANTA.JS
       ========================================================= */

    if (typeof VANTA !== "undefined") {

        VANTA.NET({
            el: "#vanta-canvas",
            color: 0xff7a29,
            backgroundColor: 0x0057D8,
            points: 12,
            maxDistance: 20,
            spacing: 18
        });

    }


    /* =========================================================
       AFFICHER / MASQUER LE MOT DE PASSE
       ========================================================= */

    const togglePassword =
        document.getElementById("togglePassword");

    const password =
        document.getElementById("password");

    if (togglePassword && password) {

        togglePassword.addEventListener("click", function () {

            if (password.type === "password") {

                password.type = "text";

                this.innerHTML =
                    '<i class="fas fa-eye-slash"></i>';

                this.setAttribute(
                    "aria-label",
                    "Masquer le mot de passe"
                );

            } else {

                password.type = "password";

                this.innerHTML =
                    '<i class="fas fa-eye"></i>';

                this.setAttribute(
                    "aria-label",
                    "Afficher le mot de passe"
                );
            }

        });

    }

</script>
